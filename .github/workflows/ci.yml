name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generator/requirements.txt
      - run: pip install -r generator/requirements.txt
      - name: Vérifie la syntaxe
        run: python -m compileall -q generator
      - name: Tests du générateur (sans MongoDB)
        run: python test_geojson.py
        working-directory: generator

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valide les fichiers docker compose
        run: |
          cp .env.example .env
          docker compose config -q
      - name: Vérifie les scripts shell
        run: shellcheck -S warning scripts/*.sh
