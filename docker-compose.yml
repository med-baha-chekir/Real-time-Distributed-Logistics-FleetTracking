services:
  mongo1: &mongo
    image: mongo:7.0
    container_name: mongo1
    command: ["mongod","--replSet","rs0","--bind_ip_all","--wiredTigerCacheSizeGB","0.25"]
    volumes: ["mongo1-data:/data/db","./scripts:/scripts:ro"]
    ports: ["27017:27017"]
  mongo2:
    <<: *mongo
    container_name: mongo2
    volumes: ["mongo2-data:/data/db"]
    ports: ["27018:27017"]
  mongo3:
    <<: *mongo
    container_name: mongo3
    volumes: ["mongo3-data:/data/db"]
    ports: ["27019:27017"]

  generator:
    build: ./generator
    depends_on: [mongo1, mongo2, mongo3]
    environment:
      MONGO_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
      TRUCKS: "500"
      INTERVAL: "5"
      DURATION: "0"

  dashboard:
    build: ./dashboard
    depends_on: [mongo1, mongo2, mongo3]
    environment:
      MONGO_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
    ports: ["8501:8501"]

volumes: {mongo1-data: {}, mongo2-data: {}, mongo3-data: {}}