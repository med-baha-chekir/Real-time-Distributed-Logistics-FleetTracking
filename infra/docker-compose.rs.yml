
name: fleet-rs

# Décision réseau : tout tourne sur le PC de A.
# Les ports ne sont publiés que sur 127.0.0.1 (pas d'accès depuis le réseau).
# Le générateur et le dashboard tournent dans le réseau Docker "fleet-net",
# où les noms mongo1/mongo2/mongo3 sont résolus.

x-mongo: &mongo
  image: mongo:7
  command:
    - mongod
    - --replSet
    - rs0
    - --bind_ip_all
    - --wiredTigerCacheSizeGB
    - "0.5"
  mem_limit: 1g
  networks:
    - fleet-net
  restart: unless-stopped
  healthcheck:
    test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - "db.adminCommand('ping').ok"
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s

services:
  mongo1:
    <<: *mongo
    container_name: mongo1
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo1-data:/data/db
      - ./scripts:/scripts:ro

  mongo2:
    <<: *mongo
    container_name: mongo2
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo2-data:/data/db

  mongo3:
    <<: *mongo
    container_name: mongo3
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - mongo3-data:/data/db

  # Générateur de télémétrie : lancé à la demande (profil "app").
  #   docker compose -f infra/docker-compose.rs.yml --profile app run --rm generator
  generator:
    build: ../generator
    image: fleet-generator
    profiles: ["app"]
    env_file:
      - path: ../.env
        required: false
    environment:
      # Forcé ici : dans le conteneur, seule l'URI du Replica Set est valide.
      MONGO_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
    depends_on:
      mongo1: { condition: service_healthy }
      mongo2: { condition: service_healthy }
      mongo3: { condition: service_healthy }
    networks:
      - fleet-net

  # Dashboard Streamlit (sprint 4) : à décommenter quand dashboard/ existe.
  # dashboard:
  #   build: ../dashboard
  #   image: fleet-dashboard
  #   profiles: ["app"]
  #   env_file:
  #     - path: ../.env
  #       required: false
  #   environment:
  #     MONGO_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
  #   ports:
  #     - "127.0.0.1:8501:8501"
  #   depends_on:
  #     mongo1: { condition: service_healthy }
  #   networks:
  #     - fleet-net

networks:
  fleet-net:
    name: fleet-net

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
