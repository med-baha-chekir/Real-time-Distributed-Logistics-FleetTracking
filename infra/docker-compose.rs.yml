
name: fleet-rs

x-mongo: &mongo
  image: mongo:7
  command:
    - mongod
    - --replSet
    - rs0
    - --bind_ip_all
    - --wiredTigerCacheSizeGB
    - "0.5"
  mem_limit: 1g
  networks:
    - fleet-net
  restart: unless-stopped
  healthcheck:
    test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - "db.adminCommand('ping').ok"
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s

services:
  mongo1:
    <<: *mongo
    container_name: mongo1
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo1-data:/data/db
      - ./scripts:/scripts:ro

  mongo2:
    <<: *mongo
    container_name: mongo2
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo2-data:/data/db

  mongo3:
    <<: *mongo
    container_name: mongo3
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - mongo3-data:/data/db

networks:
  fleet-net:
    name: fleet-net

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
